services:
  frontend:
    container_name: kakeibo_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

  backend:
    container_name: kakeibo_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.test
    environment:
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_ORIGIN: http://localhost:5173

  migrate:
    image: migrate/migrate:v4.18.3
    profiles:
      - tools
    volumes:
      - ./backend/migrations:/migrations:ro
    env_file:
      - ./backend/.env.test
    entrypoint: [ "migrate" ]
